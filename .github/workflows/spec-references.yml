# Post/update a sticky PR comment linking this PR's cited spec identifiers to
# their defining files. Reusable lives in the spec repo. GOV-R32.
name: spec-references
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
jobs:
  refs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-references.yml@7685ff1dd36aafe05bd6ce9b1bd642f052e7b599 # main
