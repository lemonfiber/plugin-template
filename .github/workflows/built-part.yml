# The built-part variant's image, built and run under the posture its manifest
# declares as a part's repository runs it on a pull request (ARCH-R250). Only a
# pull request runs it here, so nothing is published or pinned from the template.
name: built-part
on: [pull_request]
permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A reusable workflow is refused where its caller grants less than any of its
  # jobs asks, published or not; on a pull request nothing is published.
  image:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: lemonfiber/spec/.github/workflows/first-party-image.yml@c7c9518ba96b3f75119bdf1646577ddeea28dc88 # v1.0.88
    with:
      directory: built-part
