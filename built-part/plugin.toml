schema_version = 1

[plugin]
id          = "door"
name        = "Door"
version     = "0.18.0"
description = "Lets the household reach Jellyfin, and lets an item's stream or picture out only to someone allowed to see it"
without_it  = "Jellyfin answers on this machine only, and nothing else in the house can play from it"
upstream    = "https://github.com/caddyserver/caddy"
license     = "Apache-2.0"
forms       = ["library", "full"]

[[service]]
id          = "door"
name        = "Door"
image       = "caddy"
digest      = "sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73"
tag         = "2.11.6"
port        = 8096
bind        = "lan"
health      = { kind = "tcp", timeout_s = 30 }
criticality = "important"
memory_mib  = 50
reaches     = ""
asks_for    = "Nothing beyond this machine. It asks Jellyfin, beside it, whether the session a request presents may see the item it asks for, and fetches no certificate: it serves the one lemonfiber makes for it in its configuration directory."
config_path = "/etc/caddy"
config_ro   = true
tmpfs       = ["/data", "/config"]
user_mode   = "uid"
replaces    = "door"

[service.certificate]
key         = "key.pem"
certificate = "certificate.pem"
names       = ["door"]

[[service.publish]]
port = 8920

[[proof]]
id      = "door.refuses-an-id-in-braces"
title   = "A stream asked for with an id in braces is refused at the door"
fixture = "recordings/door/stream-id-in-braces.json"
why     = """
Jellyfin reads an id in braces as the same item, and the door cannot ask
Jellyfin whether a session may see an id written that way, so the door refuses
it itself without asking anything behind it. The refusal is the pass.
"""
request = { method = "GET", path = "/Videos/%7Bdeadbeef-0000-0000-0000-000000000000%7D/stream?static=true" }
expect  = { status = 403 }

[[proof]]
id      = "door.version"
title   = "The image's own Caddy says which release it is"
run     = { args = ["caddy", "version"] }
expect  = { exit = 0, stdout_starts_with = "v2.11.6 " }
fixture = "recordings/door/version.json"
why     = """
The other proof here is a status the door chose, which a port proxy or another
server could give as well. Run as the image's own command, Caddy names the
release it was built from, which says the image is the Caddy this part is
built on, at the release its Dockerfile pins.
"""
